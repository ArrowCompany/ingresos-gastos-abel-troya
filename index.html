<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ingresos y Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F4EE;
    --paper: #FFFFFF;
    --ink: #1C2521;
    --ink-soft: #63706A;
    --emerald: #0F6B4C;
    --emerald-soft: #E4F0EA;
    --brick: #B5453B;
    --brick-soft: #F7E7E4;
    --line: #E4E0D6;
    --gold: #C89B3C;
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    padding-bottom:40px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 20px 14px;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  header .icon-btn{
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--emerald);
  }
  .icon-btn svg{width:18px;height:18px;}

  main{padding:0 20px;}

  .btn-agregar{
    width:100%;
    background:var(--emerald);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px;
    font-family:'Inter';
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:18px;
    transition:transform .15s ease, background .15s ease;
  }
  .btn-agregar:active{transform:scale(.98);}

  .mes-selector{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 8px;
    margin-bottom:16px;
  }
  .mes-selector button{
    width:36px;height:36px;border-radius:50%;border:none;background:transparent;
    color:var(--ink-soft);font-size:18px;cursor:pointer;
  }
  .mes-selector button:active{background:var(--bg);}
  .mes-selector span{
    font-family:'Fraunces',serif;font-weight:600;font-size:16px;text-transform:capitalize;
  }

  .resumen{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:22px;
  }
  .resumen .card{
    border-radius:14px;
    padding:12px 10px;
    text-align:center;
  }
  .resumen .card.ingresos{background:var(--emerald-soft);}
  .resumen .card.gastos{background:var(--brick-soft);}
  .resumen .card.balance{background:var(--paper); border:1px solid var(--line);}
  .resumen .card .label{font-size:11px;color:var(--ink-soft);font-weight:500;}
  .resumen .card .valor{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:17px;
    margin-top:2px;
  }
  .resumen .card.ingresos .valor{color:var(--emerald);}
  .resumen .card.gastos .valor{color:var(--brick);}

  .km-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
  }
  .km-card .label{font-size:11px;color:var(--ink-soft);font-weight:500;}
  .km-card .valor{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:18px;
    margin-top:2px;
  }
  .km-card .valor.gasto{color:var(--brick);}

  .filtro-cat{
    display:flex;align-items:center;gap:8px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:14px;
    cursor:pointer;
  }
  .filtro-cat .txt{flex:1;font-size:14px;color:var(--ink-soft);}
  .filtro-cat.activo{border-color:var(--emerald); background:var(--emerald-soft);}
  .filtro-cat.activo .txt{color:var(--emerald);font-weight:600;}
  .chip-x{
    display:none;
    width:20px;height:20px;border-radius:50%;
    background:var(--emerald);color:#fff;
    align-items:center;justify-content:center;font-size:12px;
  }
  .filtro-cat.activo .chip-x{display:flex;}

  .seccion-label{
    font-size:12px;font-weight:600;letter-spacing:.06em;
    color:var(--ink-soft);text-transform:uppercase;
    margin:18px 0 10px 2px;
  }

  .lista{
    background:var(--paper);
    border-radius:var(--radius);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .mov{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .mov:last-child{border-bottom:none;}
  .mov .izq .desc{font-weight:600;font-size:14.5px;}
  .mov .izq .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .mov .der{display:flex;align-items:center;gap:10px;}
  .mov .monto{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14.5px;}
  .mov .monto.ingreso{color:var(--emerald);}
  .mov .monto.gasto{color:var(--brick);}
  .mov .del{
    width:28px;height:28px;border:none;background:none;color:#B7ABA0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  .vacio{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }

  /* Modal agregar */
  .overlay{
    position:fixed;inset:0;background:rgba(28,37,33,.45);
    display:none;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper);
    width:100%;max-width:480px;
    border-radius:22px 22px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:subir .25s ease;
  }
  @keyframes subir{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h2{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0 0 16px;}
  .tipo-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .tipo-toggle button{
    flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);
    background:var(--paper);font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-soft);
  }
  .tipo-toggle button.on-gasto{background:var(--brick-soft);border-color:var(--brick);color:var(--brick);}
  .tipo-toggle button.on-ingreso{background:var(--emerald-soft);border-color:var(--emerald);color:var(--emerald);}

  .campo{margin-bottom:12px;}
  .campo label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .campo input, .campo select{
    width:100%;padding:12px 12px;border-radius:11px;border:1px solid var(--line);
    font-family:'Inter';font-size:15px;background:var(--bg);color:var(--ink);
  }
  .campo input:focus, .campo select:focus{outline:2px solid var(--emerald);outline-offset:0;}

  .modal-btns{display:flex;gap:10px;margin-top:18px;}
  .modal-btns button{
    flex:1;padding:14px;border-radius:12px;border:none;font-weight:600;font-size:15px;cursor:pointer;
  }
  .btn-cancelar{background:var(--bg);color:var(--ink-soft);}
  .btn-guardar{background:var(--emerald);color:#fff;}
  .btn-guardar:disabled{opacity:.5;}

  /* Modal categorías */
  .cat-list{max-height:50vh;overflow-y:auto;}
  .cat-item{
    padding:14px 4px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;
    font-family:'Fraunces',serif;font-weight:600;font-size:17px;
  }
  .cat-item .n{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);font-weight:500;}
  .cat-item:last-child{border-bottom:none;}
  .cat-item.todas{color:var(--emerald);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;
    font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  .estado-carga{text-align:center;padding:30px;color:var(--ink-soft);font-size:13px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Ingresos y gastos</h1>
    <button class="icon-btn" onclick="cargarMovimientos()" title="Actualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
    </button>
  </header>

  <main>
    <button class="btn-agregar" onclick="abrirModalAgregar()">+ Agregar</button>

    <div class="mes-selector">
      <button onclick="cambiarMes(-1)">‹</button>
      <span id="mesLabel"></span>
      <button onclick="cambiarMes(1)">›</button>
    </div>

    <div class="resumen">
      <div class="card ingresos">
        <div class="label">Ingresos</div>
        <div class="valor" id="totalIngresos">$0</div>
      </div>
      <div class="card gastos">
        <div class="label">Gastos</div>
        <div class="valor" id="totalGastos">$0</div>
      </div>
      <div class="card balance">
        <div class="label">Balance</div>
        <div class="valor" id="totalBalance">$0</div>
      </div>
    </div>

    <div class="km-card" id="kmCard" style="display:none;">
      <div>
        <div class="label">Km recorrido (último gasto)</div>
        <div class="valor" id="totalKm">0 km</div>
      </div>
      <div>
        <div class="label">Costo combustible (total mes)</div>
        <div class="valor gasto" id="totalCombustible">$0</div>
      </div>
    </div>

    <div class="filtro-cat" id="filtroCat" onclick="abrirModalCategorias()">
      <span class="txt" id="filtroCatTxt">Elegir detalles — filtrar por categoría</span>
      <span class="chip-x" onclick="event.stopPropagation(); quitarFiltro()">✕</span>
    </div>

    <div class="seccion-label" id="listaLabel">Movimientos del mes</div>
    <div class="lista" id="lista">
      <div class="estado-carga">Cargando…</div>
    </div>
  </main>
</div>

<!-- Modal agregar movimiento -->
<div class="overlay" id="overlayAgregar">
  <div class="modal">
    <h2>Nuevo movimiento</h2>
    <div class="tipo-toggle">
      <button type="button" id="btnGasto" onclick="elegirTipo('Gasto')">Gasto</button>
      <button type="button" id="btnIngreso" onclick="elegirTipo('Ingreso')">Ingreso</button>
    </div>
    <div class="campo">
      <label>Categoría</label>
      <input type="text" id="inCategoria" list="listaCategorias" placeholder="Ej. Gasolina, Comida, Repuestos" oninput="revisarCategoriaGasolina()">
      <datalist id="listaCategorias"></datalist>
    </div>
    <div class="campo" id="campoKm" style="display:none;">
      <label>Kilometraje</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div>
          <input type="number" id="inKmAnterior" placeholder="Km anterior" readonly style="background:var(--line);color:var(--ink-soft);" oninput="actualizarKmRecorrido()">
          <label style="display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--ink-soft);margin-top:6px;cursor:pointer;">
            <input type="checkbox" id="chkEditarKmAnterior" onchange="toggleEditarKmAnterior()" style="width:15px;height:15px;accent-color:var(--emerald);cursor:pointer;">
            Editar km anterior
          </label>
        </div>
        <div>
          <input type="number" id="inKmActual" placeholder="Km actual" inputmode="numeric" oninput="actualizarKmRecorrido()">
        </div>
      </div>
      <div id="kmRecorridoPreview" style="font-size:12px;color:var(--ink-soft);margin-top:5px;"></div>
    </div>
    <div class="campo">
      <label>Descripción (opcional)</label>
      <input type="text" id="inDescripcion" placeholder="Ej. Queso, huevos y pan">
    </div>
    <div class="campo">
      <label>Monto</label>
      <input type="number" id="inMonto" inputmode="decimal" placeholder="0.00" step="0.01">
    </div>
    <div class="campo">
      <label>Fecha</label>
      <input type="date" id="inFecha">
    </div>
    <div class="modal-btns">
      <button class="btn-cancelar" onclick="cerrarModalAgregar()">Cancelar</button>
      <button class="btn-guardar" id="btnGuardar" onclick="guardarMovimiento()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal categorías -->
<div class="overlay" id="overlayCategorias">
  <div class="modal">
    <h2>Elegir detalles</h2>
    <div class="cat-list" id="catList"></div>
    <div class="modal-btns">
      <button class="btn-cancelar" style="flex:1" onclick="cerrarModalCategorias()">Cerrar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ⚠️ Reemplaza esta URL con la de tu implementación de Apps Script (termina en /exec)
const API_URL = "https://script.google.com/macros/s/AKfycbwoMsKoS3pEgc0Vpa2dlM8nk_Tht5qpWGycJeeninY_u2dNPE3kZrUsfQfdOkK14BOTvQ/exec";

let movimientos = [];
let mesActual = new Date();
let tipoSeleccionado = 'Gasto';
let categoriaFiltro = null;

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function fmtMoney(n){
  const signo = n < 0 ? '-' : '';
  return signo + '$' + Math.abs(n).toFixed(2).replace(/\.00$/, '');
}

function mesKey(date){
  return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0');
}

function actualizarMesLabel(){
  document.getElementById('mesLabel').textContent = MESES[mesActual.getMonth()] + ' ' + mesActual.getFullYear();
}

function cambiarMes(delta){
  mesActual.setMonth(mesActual.getMonth() + delta);
  actualizarMesLabel();
  render();
}

async function cargarMovimientos(){
  document.getElementById('lista').innerHTML = '<div class="estado-carga">Cargando…</div>';
  try{
    const res = await fetch(API_URL + '?action=list');
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Error al leer datos');
    movimientos = data.movimientos;
    render();
  }catch(err){
    document.getElementById('lista').innerHTML = '<div class="estado-carga">No se pudo conectar con la hoja.<br>Revisa la API_URL en el código.</div>';
    console.error(err);
  }
}

function movimientosDelMes(){
  const key = mesKey(mesActual);
  return movimientos.filter(m => m.fecha && m.fecha.startsWith(key));
}

function render(){
  actualizarMesLabel();
  const delMes = movimientosDelMes();

  const ingresos = delMes.filter(m => m.tipo === 'Ingreso').reduce((a,b)=>a+b.monto,0);
  const gastos = delMes.filter(m => m.tipo === 'Gasto').reduce((a,b)=>a+b.monto,0);
  document.getElementById('totalIngresos').textContent = fmtMoney(ingresos);
  document.getElementById('totalGastos').textContent = fmtMoney(gastos);
  document.getElementById('totalBalance').textContent = fmtMoney(ingresos - gastos);

  const gasolinaDelMes = delMes.filter(m => esCategoriaGasolina(m.categoria));
  const kmCard = document.getElementById('kmCard');
  if(gasolinaDelMes.length > 0){
    const ordenados = gasolinaDelMes.slice().sort((a,b) => a.fecha === b.fecha ? Number(a.id) - Number(b.id) : a.fecha.localeCompare(b.fecha));
    const ultimo = ordenados[ordenados.length - 1];
    const kmUltimo = (ultimo.kmAnterior != null && ultimo.kmActual != null && ultimo.kmActual > ultimo.kmAnterior)
      ? ultimo.kmActual - ultimo.kmAnterior : 0;
    const costoTotal = gasolinaDelMes.reduce((a,b)=> a + b.monto, 0);
    document.getElementById('totalKm').textContent = kmUltimo + ' km';
    document.getElementById('totalCombustible').textContent = fmtMoney(costoTotal);
    kmCard.style.display = 'grid';
  }else{
    kmCard.style.display = 'none';
  }

  let filtrados = delMes;
  const filtroEl = document.getElementById('filtroCat');
  const filtroTxt = document.getElementById('filtroCatTxt');
  const label = document.getElementById('listaLabel');

  if(categoriaFiltro){
    filtrados = delMes.filter(m => m.categoria === categoriaFiltro);
    filtroEl.classList.add('activo');
    filtroTxt.textContent = categoriaFiltro;
    const total = filtrados.reduce((a,b)=> a + (b.tipo==='Gasto' ? -b.monto : b.monto), 0);
    label.textContent = categoriaFiltro + ' este mes · ' + fmtMoney(total);
  }else{
    filtroEl.classList.remove('activo');
    filtroTxt.textContent = 'Elegir detalles — filtrar por categoría';
    label.textContent = 'Movimientos del mes';
  }

  filtrados = filtrados.slice().sort((a,b)=> b.fecha.localeCompare(a.fecha));

  const lista = document.getElementById('lista');
  if(filtrados.length === 0){
    lista.innerHTML = '<div class="vacio">No hay movimientos aquí todavía.</div>';
    return;
  }

  lista.innerHTML = filtrados.map(m => `
    <div class="mov">
      <div class="izq">
        <div class="desc">${m.categoria || m.descripcion || 'Sin categoría'}</div>
        <div class="meta">${formatearFecha(m.fecha)}${m.descripcion && m.categoria ? ' · ' + m.descripcion : ''}${m.kmAnterior != null && m.kmActual != null ? ' · ' + m.kmAnterior + ' → ' + m.kmActual + ' km' : ''} · ${m.origen || 'Manual'}</div>
      </div>
      <div class="der">
        <div class="monto ${m.tipo === 'Ingreso' ? 'ingreso' : 'gasto'}">${m.tipo === 'Ingreso' ? '+' : '-'}${fmtMoney(m.monto)}</div>
        <button class="del" onclick="borrarMovimiento('${m.id}')" title="Eliminar">🗑</button>
      </div>
    </div>
  `).join('');
}

function esCategoriaGasolina(cat){
  return (cat || '').trim().toLowerCase() === 'gasolina';
}

function ultimoKmActualGasolina(){
  const registros = movimientos
    .filter(m => esCategoriaGasolina(m.categoria) && m.kmActual != null)
    .slice()
    .sort((a,b) => a.fecha === b.fecha ? Number(a.id) - Number(b.id) : a.fecha.localeCompare(b.fecha));
  if(registros.length === 0) return null;
  return registros[registros.length - 1].kmActual;
}

function toggleEditarKmAnterior(){
  const chk = document.getElementById('chkEditarKmAnterior');
  const input = document.getElementById('inKmAnterior');
  if(chk.checked){
    input.removeAttribute('readonly');
    input.style.background = 'var(--bg)';
    input.style.color = 'var(--ink)';
    input.focus();
  }else{
    input.setAttribute('readonly', 'readonly');
    input.style.background = 'var(--line)';
    input.style.color = 'var(--ink-soft)';
    const ultimoKm = ultimoKmActualGasolina();
    input.value = ultimoKm != null ? ultimoKm : '';
    actualizarKmRecorrido();
  }
}

function revisarCategoriaGasolina(){
  const categoria = document.getElementById('inCategoria').value;
  const campoKm = document.getElementById('campoKm');
  if(esCategoriaGasolina(categoria)){
    campoKm.style.display = 'block';
    const chk = document.getElementById('chkEditarKmAnterior');
    chk.checked = false;
    const input = document.getElementById('inKmAnterior');
    input.setAttribute('readonly', 'readonly');
    input.style.background = 'var(--line)';
    input.style.color = 'var(--ink-soft)';
    const ultimoKm = ultimoKmActualGasolina();
    input.value = ultimoKm != null ? ultimoKm : '';
    actualizarKmRecorrido();
  }else{
    campoKm.style.display = 'none';
    document.getElementById('inKmAnterior').value = '';
    document.getElementById('inKmActual').value = '';
    document.getElementById('kmRecorridoPreview').textContent = '';
  }
}

function actualizarKmRecorrido(){
  const anterior = parseFloat(document.getElementById('inKmAnterior').value);
  const actual = parseFloat(document.getElementById('inKmActual').value);
  const preview = document.getElementById('kmRecorridoPreview');
  if(!isNaN(anterior) && !isNaN(actual) && actual > anterior){
    preview.textContent = 'Km recorrido: ' + (actual - anterior) + ' km';
  }else if(!isNaN(actual) && !isNaN(anterior) && actual <= anterior){
    preview.textContent = 'El km actual debe ser mayor al anterior';
  }else{
    preview.textContent = '';
  }
}

function formatearFecha(f){
  const [y,mo,d] = f.split('-');
  return d + '/' + mo + '/' + y;
}

// ---- Modal categorías ----
function abrirModalCategorias(){
  const delMes = movimientosDelMes();
  const categorias = {};
  delMes.forEach(m => {
    const cat = m.categoria || 'Sin categoría';
    if(!categorias[cat]) categorias[cat] = 0;
    categorias[cat]++;
  });
  const catList = document.getElementById('catList');
  let html = `<div class="cat-item todas" onclick="seleccionarCategoria(null)"><span>Todas</span><span class="n">${delMes.length}</span></div>`;
  html += Object.keys(categorias).sort().map(cat =>
    `<div class="cat-item" onclick="seleccionarCategoria('${cat.replace(/'/g, "\\'")}')"><span>${cat}</span><span class="n">${categorias[cat]}</span></div>`
  ).join('');
  catList.innerHTML = html || '<div class="vacio">Sin movimientos este mes.</div>';
  document.getElementById('overlayCategorias').classList.add('show');
}
function cerrarModalCategorias(){
  document.getElementById('overlayCategorias').classList.remove('show');
}
function seleccionarCategoria(cat){
  categoriaFiltro = cat;
  cerrarModalCategorias();
  render();
}
function quitarFiltro(){
  categoriaFiltro = null;
  render();
}

// ---- Modal agregar ----
function abrirModalAgregar(){
  document.getElementById('inFecha').value = new Date().toISOString().slice(0,10);
  elegirTipo('Gasto');
  const datalist = document.getElementById('listaCategorias');
  const cats = [...new Set(movimientos.map(m => m.categoria).filter(Boolean))];
  datalist.innerHTML = cats.map(c => `<option value="${c}">`).join('');
  document.getElementById('campoKm').style.display = 'none';
  document.getElementById('inKmAnterior').value = '';
  document.getElementById('inKmActual').value = '';
  document.getElementById('kmRecorridoPreview').textContent = '';
  document.getElementById('chkEditarKmAnterior').checked = false;
  document.getElementById('inKmAnterior').setAttribute('readonly', 'readonly');
  document.getElementById('inKmAnterior').style.background = 'var(--line)';
  document.getElementById('inKmAnterior').style.color = 'var(--ink-soft)';
  document.getElementById('overlayAgregar').classList.add('show');
}
function cerrarModalAgregar(){
  document.getElementById('overlayAgregar').classList.remove('show');
  document.getElementById('inCategoria').value = '';
  document.getElementById('inDescripcion').value = '';
  document.getElementById('inMonto').value = '';
  document.getElementById('campoKm').style.display = 'none';
  document.getElementById('inKmAnterior').value = '';
  document.getElementById('inKmActual').value = '';
  document.getElementById('kmRecorridoPreview').textContent = '';
  document.getElementById('chkEditarKmAnterior').checked = false;
  document.getElementById('inKmAnterior').setAttribute('readonly', 'readonly');
  document.getElementById('inKmAnterior').style.background = 'var(--line)';
  document.getElementById('inKmAnterior').style.color = 'var(--ink-soft)';
}
function elegirTipo(tipo){
  tipoSeleccionado = tipo;
  document.getElementById('btnGasto').className = tipo === 'Gasto' ? 'on-gasto' : '';
  document.getElementById('btnIngreso').className = tipo === 'Ingreso' ? 'on-ingreso' : '';
}

async function guardarMovimiento(){
  const categoria = document.getElementById('inCategoria').value.trim();
  const descripcion = document.getElementById('inDescripcion').value.trim();
  const monto = parseFloat(document.getElementById('inMonto').value);
  const fecha = document.getElementById('inFecha').value;

  if(!categoria || !monto || monto <= 0 || !fecha){
    mostrarToast('Completa categoría, monto y fecha');
    return;
  }

  let kmAnterior = null, kmActual = null;
  if(esCategoriaGasolina(categoria)){
    const anteriorVal = document.getElementById('inKmAnterior').value;
    const actualVal = document.getElementById('inKmActual').value;
    if(actualVal === ''){
      mostrarToast('Ingresa el km actual');
      return;
    }
    kmAnterior = anteriorVal !== '' ? Number(anteriorVal) : null;
    kmActual = Number(actualVal);
    if(kmAnterior != null && kmActual <= kmAnterior){
      mostrarToast('El km actual debe ser mayor al anterior');
      return;
    }
  }

  const btn = document.getElementById('btnGuardar');
  btn.disabled = true; btn.textContent = 'Guardando…';

  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({
        action: 'add',
        tipo: tipoSeleccionado,
        categoria, descripcion, monto, fecha,
        origen: 'Manual',
        kmAnterior, kmActual
      })
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error);
    cerrarModalAgregar();
    mostrarToast('Movimiento guardado');
    await cargarMovimientos();
  }catch(err){
    mostrarToast('Error al guardar');
    console.error(err);
  }finally{
    btn.disabled = false; btn.textContent = 'Guardar';
  }
}

async function borrarMovimiento(id){
  if(!confirm('¿Eliminar este movimiento?')) return;
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({action:'delete', id})
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error);
    mostrarToast('Eliminado');
    await cargarMovimientos();
  }catch(err){
    mostrarToast('Error al eliminar');
    console.error(err);
  }
}

function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

// Init
actualizarMesLabel();
cargarMovimientos();
</script>
